# Example of config/settings.toml. Put it in the repository that uses mloom (the current
# directory of the run), not in mloom. Every key is optional; a missing key uses its default.

[columns]
# A feature column whose missing rate is above this, in the rows with a target or in all rows,
# is excluded (high_missing). 0 to 1; default 0.5.
max_missing_rate = 0.5

[preprocessing]
# Whether rows without a target are used for the missing rates and for the median of the
# imputation and the mean and standard deviation of the scaling. Default true.
use_unlabeled_rows = true
