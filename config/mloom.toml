# Defaults of the settings of mloom. Every key must be here: mloom has no other defaults.
#
# A key is read from the first of these files that sets it:
#   1. config/mloom.toml of the repository that uses mloom (the current directory of the run),
#      or the file given by --settings
#   2. config/mloom.local.toml of this repository (not tracked by git; defaults of one machine)
#   3. this file
# This file is also shipped in the wheel, for an installation without a clone of this repository.

[columns]
# A feature column whose missing rate is above this, in the rows with a target or in all rows,
# is excluded (high_missing). 0 to 1.
max_missing_rate = 0.5

[preprocessing]
# Whether rows without a target are used for the missing rates and for the median of the
# imputation and the mean and standard deviation of the scaling.
use_unlabeled_rows = true
